<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Original illustration: a meadow at dawn, seen from low in the grass. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f7e"/>
      <stop offset="0.18" stop-color="#7a7fbf"/>
      <stop offset="0.32" stop-color="#c7a9c4"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.66" cy="0.2" r="0.4">
      <stop offset="0" stop-color="#fff4d6" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffd9a0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f83bd"/><stop offset="1" stop-color="#9f9cc4"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a8f86"/><stop offset="1" stop-color="#4f7458"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa957"/><stop offset="1" stop-color="#477f36"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55913a"/><stop offset="1" stop-color="#1f4618"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2dc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f6e3f0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff2dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9c9ec"/><stop offset="1" stop-color="#6f6fae"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0a1a" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Tall, thin noise reads as grass blades. -->
    <filter id="grass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.55" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.26  0 0 0 0 0.07  0 0 0 1.1 -0.38"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="grass-lite" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.75  0 0 0 0 0.9  0 0 0 0 0.45  0 0 0 0.9 -0.45"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sun)"/>

  <path d="M0 330 C 200 250, 380 290, 560 260 C 760 220, 900 280, 1100 250 C 1300 215, 1500 275, 1700 240 C 1820 225, 1880 250, 1920 240 L 1920 1080 L 0 1080 Z" fill="url(#far)" opacity="0.9"/>
  <rect y="210" width="1920" height="220" fill="url(#haze)"/>

  <path d="M0 400 C 240 350, 420 400, 700 365 C 980 330, 1200 400, 1480 365 C 1700 340, 1840 372, 1920 365 L 1920 1080 L 0 1080 Z" fill="url(#mid)"/>
  <g fill="#33584a" opacity="0.9">
    <path d="M300 372 l14 -46 l14 46 Z"/><path d="M322 376 l11 -36 l11 36 Z"/>
    <path d="M1560 356 l16 -54 l16 54 Z"/><path d="M1590 360 l12 -40 l12 40 Z"/><path d="M1618 358 l9 -30 l9 30 Z"/>
    <path d="M1180 382 l10 -34 l10 34 Z"/>
  </g>

  <path d="M0 520 C 300 470, 600 540, 960 500 C 1300 465, 1600 525, 1920 490 L 1920 1080 L 0 1080 Z" fill="url(#near)"/>
  <path d="M0 520 C 300 470, 600 540, 960 500 C 1300 465, 1600 525, 1920 490 L 1920 1080 L 0 1080 Z" fill="#000" filter="url(#grass)" opacity="0.6"/>

  <path d="M1000 1080 C 1040 900, 1180 780, 1330 680 C 1420 625, 1520 600, 1620 575 L 1660 583 C 1560 610, 1470 640, 1390 690 C 1270 770, 1150 900, 1130 1080 Z" fill="url(#stream)" opacity="0.8"/>

  <path d="M0 700 C 400 660, 800 720, 1200 680 C 1500 650, 1750 700, 1920 680 L 1920 1080 L 0 1080 Z" fill="url(#front)"/>
  <path d="M0 700 C 400 660, 800 720, 1200 680 C 1500 650, 1750 700, 1920 680 L 1920 1080 L 0 1080 Z" fill="#000" filter="url(#grass)"/>
  <path d="M0 700 C 400 660, 800 720, 1200 680 C 1500 650, 1750 700, 1920 680 L 1920 1080 L 0 1080 Z" fill="#000" filter="url(#grass-lite)" opacity="0.5"/>

  <g opacity="0.9">
    <circle cx="140" cy="760" r="5" fill="#f4a6c8"/><circle cx="210" cy="820" r="4" fill="#ffe27a"/><circle cx="330" cy="740" r="4" fill="#f4a6c8"/>
    <circle cx="420" cy="900" r="6" fill="#ffffff"/><circle cx="560" cy="780" r="4" fill="#ffe27a"/><circle cx="640" cy="960" r="5" fill="#f4a6c8"/>
    <circle cx="700" cy="1050" r="5" fill="#ffffff"/><circle cx="1000" cy="1062" r="5" fill="#ffe27a"/><circle cx="1500" cy="760" r="4" fill="#f4a6c8"/>
    <circle cx="1640" cy="900" r="6" fill="#ffffff"/><circle cx="1760" cy="740" r="4" fill="#ffe27a"/><circle cx="1850" cy="960" r="5" fill="#f4a6c8"/>
    <circle cx="90" cy="1010" r="7" fill="#c7a6ff"/><circle cx="1720" cy="1040" r="7" fill="#c7a6ff"/><circle cx="260" cy="980" r="6" fill="#ffe27a"/>
    <circle cx="1450" cy="1010" r="6" fill="#f4a6c8"/><circle cx="60" cy="600" r="3" fill="#f4a6c8"/><circle cx="1880" cy="610" r="3" fill="#ffe27a"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
